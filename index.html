
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#102c59">
<meta name="description" content="SashaStore — каталог ігор, програм та цифрового контенту.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="canonical" href="http://sashastore.net/">
<title>SashaStore</title>
<style>
:root {
  --bg:#08172e;
  --panel:#10284b;
  --card:#15345e;
  --accent:#2878ed;
  --text:#ffffff;
  --muted:#a9bdd9;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:Arial,sans-serif;
}
header{
  padding:20px 6%;background:var(--panel);
  display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:15px;
}
.logo{font-size:25px;font-weight:800}
.logo span{color:#55a0ff}
nav{display:flex;gap:18px;flex-wrap:wrap}
nav a{color:var(--text);text-decoration:none}
nav a:hover{color:#80b8ff}
main{max-width:1150px;margin:auto;padding:25px}
.hero{
  background:linear-gradient(120deg,#153d76,#216bd0);
  border-radius:18px;padding:35px 25px;margin-bottom:25px;
}
.hero h1{font-size:34px;margin:0 0 12px}
.hero p{color:#e0edff}
.search{display:flex;gap:10px;margin-top:22px}
input,select{
  background:var(--panel);color:var(--text);
  border:1px solid #34577f;border-radius:10px;
  padding:14px;font-size:15px;
}
input{flex:1;min-width:0}
button{
  background:var(--accent);color:white;border:0;
  padding:12px 18px;border-radius:10px;cursor:pointer;
}
button:hover{filter:brightness(1.12)}
h2{margin-top:28px}
.categories{display:flex;gap:10px;flex-wrap:wrap}
.categories button{background:var(--panel)}
.categories button.active{background:var(--accent)}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:15px;margin-top:18px;
}
.card{
  background:var(--card);border-radius:14px;
  padding:18px;min-height:160px;
}
.card .emoji{font-size:30px}
.card h3{margin:12px 0 7px}
.card p{color:var(--muted);font-size:14px}
.card small{color:#a9cfff}
.card a{color:#8dc0ff}
.settings{
  background:var(--panel);padding:20px;
  border-radius:14px;margin-top:35px;
}
footer{text-align:center;padding:30px;color:var(--muted)}
footer a{color:#8dc0ff}
.empty{color:var(--muted);padding:20px}
@media(max-width:600px){
  .hero h1{font-size:27px}
  .search{flex-direction:column}
  header{padding:17px}
}
</style>
</head>
<body>
<header>
  <div class="logo">Sasha<span>Store</span></div>
  <nav>
    <a href="#home">Головна</a>
    <a href="#catalog">Каталог</a>
    <a href="#settings">Налаштування</a>
  </nav>
</header>

<main>
<section class="hero" id="home">
  <h1>Ласкаво просимо в SashaStore</h1>
  <p>Знаходь цікаві ігри, програми та цифровий контент в одному місці.</p>
  <div class="search">
    <input id="search" type="search" placeholder="Шукати ігри та програми..." aria-label="Пошук">
    <button onclick="render()">Шукати</button>
  </div>
</section>

<section id="catalog">
  <h2>Каталог</h2>
  <div class="categories" id="categories">
    <button class="active" onclick="setCategory('Усі',this)">Усі</button>
    <button onclick="setCategory('Ігри',this)">Ігри</button>
    <button onclick="setCategory('Програми',this)">Програми</button>
    <button onclick="setCategory('Інше',this)">Інше</button>
  </div>
  <div class="grid" id="grid"></div>
</section>

<section class="settings" id="settings">
  <h2>Налаштування дизайну</h2>
  <p>Обери одну з 10 синіх тем:</p>
  <select id="theme" onchange="changeTheme(this.value)">
    <option value="0">1. Dark Blue</option>
    <option value="1">2. Light Blue</option>
    <option value="2">3. Ocean</option>
    <option value="3">4. Midnight</option>
    <option value="4">5. Sky</option>
    <option value="5">6. Classic</option>
    <option value="6">7. Modern</option>
    <option value="7">8. Deep Sea</option>
    <option value="8">9. Steel Blue</option>
    <option value="9">10. Pro Blue</option>
  </select>
</section>
</main>

<footer>
  SashaStore © 2026
  <p><a href="http://sashastore.net/">sashastore.net</a></p>
</footer>

<script>
const games = [
 {name:"Minecraft",cat:"Ігри",emoji:"⛏️",desc:"Гра про будівництво та пригоди."},
 {name:"Roblox",cat:"Ігри",emoji:"🎮",desc:"Платформа з іграми користувачів."},
 {name:"Geometry Dash",cat:"Ігри",emoji:"🔷",desc:"Ритмічна платформна гра."},
 {name:"Standoff 2",cat:"Ігри",emoji:"🎯",desc:"Командний шутер."},
 {name:"Portal 2",cat:"Ігри",emoji:"🌀",desc:"Головоломка з порталами."},
 {name:"OBS Studio",cat:"Програми",emoji:"📹",desc:"Програма для запису та трансляцій."},
 {name:"Firefox",cat:"Програми",emoji:"🦊",desc:"Веббраузер."},
 {name:"VLC",cat:"Програми",emoji:"🎬",desc:"Медіаплеєр."},
 {name:"7-Zip",cat:"Програми",emoji:"📦",desc:"Архіватор файлів."},
 {name:"GIMP",cat:"Програми",emoji:"🎨",desc:"Редактор зображень."},
 {name:"Корисні посилання",cat:"Інше",emoji:"🔗",desc:"Добірка корисних ресурсів."}
];

let category="Усі";

function setCategory(value,btn){
 category=value;
 document.querySelectorAll(".categories button")
  .forEach(b=>b.classList.remove("active"));
 btn.classList.add("active");
 render();
}

function render(){
 const q=document.getElementById("search").value.toLowerCase().trim();
 const list=games.filter(g=>
  (category==="Усі"||g.cat===category)&&
  (g.name.toLowerCase().includes(q)||g.desc.toLowerCase().includes(q))
 );
 document.getElementById("grid").innerHTML=list.length?
 list.map(g=>`
  <article class="card">
   <div class="emoji">${g.emoji}</div>
   <h3>${g.name}</h3>
   <p>${g.desc}</p>
   <small>${g.cat}</small>
  </article>
 `).join(""):'<p class="empty">Нічого не знайдено.</p>';
}

document.getElementById("search").addEventListener("input",render);

const themes=[
 ["#08172e","#10284b","#15345e","#2878ed","#ffffff","#a9bdd9"],
 ["#eaf4ff","#ffffff","#d9eaff","#2675d8","#102c50","#52708f"],
 ["#061e32","#103c59","#155475","#1697cf","#ffffff","#a9d6e9"],
 ["#070d27","#111c45","#1b2c60","#536de8","#ffffff","#aebcf0"],
 ["#e6f5ff","#ffffff","#cdeaff","#1689dc","#12385b","#557d9c"],
 ["#10233e","#1c3555","#294a70","#438bd9","#ffffff","#b7cce3"],
 ["#0b1930","#172e50","#203e68","#3987f5","#ffffff","#b4c9e5"],
 ["#041c2c","#0a354a","#10516b","#1596bd","#ffffff","#a6d6e5"],
 ["#172638","#263e56","#365674","#5a9bd5","#ffffff","#c1d2e2"],
 ["#06152b","#0d2850","#183d70","#398cff","#ffffff","#b8d3f5"]
];

function changeTheme(i){
 const t=themes[Number(i)];
 const root=document.documentElement.style;
 ["--bg","--panel","--card","--accent","--text","--muted"]
  .forEach((v,n)=>root.setProperty(v,t[n]));
 localStorage.setItem("sashastore-theme",i);
}

const saved=localStorage.getItem("sashastore-theme");
if(saved!==null && themes[Number(saved)]){
 document.getElementById("theme").value=saved;
 changeTheme(saved);
}
render();
</script>
</body>
</html>
