
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SASHA GAMES — Game Store</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0d14;color:#fff;font-family:Arial,sans-serif}
header{height:72px;background:#121622;border-bottom:1px solid #292e40;display:flex;align-items:center;justify-content:space-between;padding:0 6%;position:sticky;top:0;z-index:5}
.logo{font-size:24px;font-weight:900;color:#a58aff}
.logo span{color:#fff}
nav{display:flex;gap:18px}
nav a{color:#ddd;text-decoration:none;font-size:14px}
nav a:hover{color:#a58aff}
.hero{padding:55px 7%;background:linear-gradient(110deg,#27145c,#172b50 65%,#101521)}
.hero small{color:#c1aaff;font-weight:bold}
.hero h1{font-size:clamp(32px,6vw,55px);margin:12px 0}
.hero p{color:#ddd}
.search{width:min(100%,480px);padding:15px;border-radius:10px;border:1px solid #484267;background:#111522;color:white;font-size:16px;margin-top:15px}
.promo{margin:25px 6%;padding:23px;border-radius:15px;background:linear-gradient(100deg,#5a36bd,#a13c9a);display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}
.promo h2{margin:0 0 7px}
.promo p{margin:0;color:#eee}
.promo strong{font-size:24px}
main{padding:10px 6% 50px}
h2{font-size:23px}
.categories{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}
.categories button{border:1px solid #34394e;background:#171c2b;color:white;padding:12px 18px;border-radius:9px;cursor:pointer}
.categories button.active,.categories button:hover{background:#7655df;border-color:#7655df}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px}
.card{background:#151a27;border:1px solid #2a3042;border-radius:14px;overflow:hidden;transition:.2s}
.card:hover{transform:translateY(-4px);border-color:#795be5}
.cover{height:135px;display:grid;place-items:center;font-size:62px;background:linear-gradient(135deg,#34245d,#17475a)}
.info{padding:16px}
.info h3{margin:0 0 9px}
.info p{color:#aeb4c4;font-size:14px;min-height:32px}
.platform{font-size:12px;color:#bcaaff}
.price{font-weight:bold;margin-top:13px;font-size:17px}
.free{color:#65dfaa}
.store{display:block;text-align:center;text-decoration:none;background:#7051d5;color:white;padding:12px;border-radius:8px;margin-top:13px;font-weight:bold}
.store:hover{background:#8a6bf1}
footer{padding:30px;text-align:center;color:#81889a;border-top:1px solid #292e40}
@media(max-width:600px){nav{gap:9px}nav a{font-size:12px}.logo{font-size:20px}}
</style>
</head>
<body>

<header>
 <div class="logo">SASHA <span>GAMES</span></div>
 <nav>
  <a href="#catalog">Каталог</a>
  <a href="#free">Безкоштовні</a>
  <a href="#sales">Акції</a>
 </nav>
</header>

<section class="hero">
 <small>ТВІЙ ІГРОВИЙ МАРКЕТПЛЕЙС</small>
 <h1>PLAY. BUY. ENJOY.</h1>
 <p>Знаходь улюблені ігри для всіх своїх пристроїв.</p>
 <input class="search" id="search" placeholder="🔎 Пошук ігор..." oninput="render()">
</section>

<section class="promo" id="sales">
 <div>
  <h2>🔥 ВИХІДНІ АКЦІЙ</h2>
  <p>Спеціальні пропозиції щовихідних у SASHA GAMES!</p>
 </div>
 <strong>WEEKEND SALE</strong>
</section>

<main id="catalog">
 <h2>🎮 Каталог ігор</h2>
 <div class="categories">
  <button class="active" onclick="choose('Усі',this)">Усі</button>
  <button onclick="choose('PC',this)">💻 PC</button>
  <button onclick="choose('iPhone',this)">📱 iPhone</button>
  <button onclick="choose('iPad',this)">📲 iPad</button>
  <button onclick="choose('Android',this)">🤖 Android</button>
  <button onclick="choose('Безкоштовні',this)">🆓 Безкоштовні</button>
 </div>
 <div class="games" id="games"></div>
</main>

<footer>
 <div class="logo">SASHA GAMES</div>
 <p>© 2026 SASHA GAMES. Незалежний ігровий каталог.</p>
</footer>

<script>
const games=[
 {name:"Roblox",icon:"🧱",desc:"Мільйони ігор в одному місці",platforms:["PC","iPhone","iPad","Android"],free:true,url:"https://www.roblox.com"},
 {name:"Fortnite",icon:"🎮",desc:"Популярна королівська битва",platforms:["PC","iPhone","iPad"],free:true,url:"https://www.fortnite.com"},
 {name:"Standoff 2",icon:"🎯",desc:"Командний онлайн-шутер",platforms:["iPhone","iPad","Android"],free:true,url:"https://www.standoff2.com"},
 {name:"Brawl Stars",icon:"⭐",desc:"Динамічні командні битви",platforms:["iPhone","iPad","Android"],free:true,url:"https://supercell.com/en/games/brawlstars/"},
 {name:"Among Us",icon:"🚀",desc:"Знайди зрадника серед друзів",platforms:["PC","iPhone","iPad","Android"],free:false,url:"https://www.innersloth.com/games/among-us/"},
 {name:"Minecraft",icon:"⛏️",desc:"Створюй власний світ",platforms:["PC","iPhone","iPad","Android"],free:false,url:"https://www.minecraft.net"},
 {name:"GTA V",icon:"🚗",desc:"Великий відкритий світ",platforms:["PC"],free:false,url:"https://www.rockstargames.com/gta-v"},
 {name:"Genshin Impact",icon:"🌍",desc:"Велика фантастична пригода",platforms:["PC","iPhone","iPad","Android"],free:true,url:"https://genshin.hoyoverse.com"}
];

let selected="Усі";

function choose(type,btn){
 selected=type;
 document.querySelectorAll(".categories button").forEach(b=>b.classList.remove("active"));
 btn.classList.add("active");
 render();
}

function render(){
 const q=document.getElementById("search").value.toLowerCase();
 const list=games.filter(g=>{
  const category=selected==="Усі" ||
   (selected==="Безкоштовні" ? g.free : g.platforms.includes(selected));
  return category && g.name.toLowerCase().includes(q);
 });

 document.getElementById("games").innerHTML=list.map(g=>`
  <article class="card">
   <div class="cover">${g.icon}</div>
   <div class="info">
    <h3>${g.name}</h3>
    <p>${g.desc}</p>
    <div class="platform">${g.platforms.join(" · ")}</div>
    <div class="price ${g.free?'free':''}">
     ${g.free?'БЕЗКОШТОВНО':'Платна гра · ціна в офіційному магазині'}
    </div>
    <a class="store" href="${g.url}" target="_blank" rel="noopener">ВІДКРИТИ ↗</a>
   </div>
  </article>
 `).join("") || "<p>Ігор не знайдено.</p>";
}
render();
</script>
</body>
</html>
